[project]
name = "academ-print-calculator"
version = "0.1.0"
description = "MVP calculator for common printing orders"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.122,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "httpx2>=2.16,<3",
  "mypy>=1.18,<2",
  "pip-audit>=2.9,<3",
  "pre-commit>=4.3,<5",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=printcalc --cov-report=term-missing --cov-fail-under=60"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["printcalc"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "D203",
  "D213",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN001", "D100", "D103", "PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/printcalc"]
